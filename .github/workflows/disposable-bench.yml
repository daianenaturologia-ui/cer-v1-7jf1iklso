name: Disposable Bench QA & Caderno Privacy

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # JOB 1: QA Geral (Vitest completo, mantendo visíveis os 8 erros conhecidos)
  # ============================================================================
  qa-general:
    name: General QA Practices (Etapa 1..9)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.5.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run General QA Practices Pipeline
        run: pnpm run qa:practices
        env:
          CER_REPORT_JSON_PATH: qa-report.json

      - name: Publicar Status do Job QA Geral no branch run-status
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          node -e '
            const fs = require("node:fs");
            let report = null;
            if (fs.existsSync("qa-report.json")) {
              try {
                report = JSON.parse(fs.readFileSync("qa-report.json", "utf8"));
              } catch (e) {
                console.warn("Falha ao ler qa-report.json:", e);
              }
            }

            const statusPayload = {
              job: "qa-general",
              job_name: "General QA Practices (Etapa 1..9)",
              sha: process.env.COMMIT_SHA,
              conclusion: process.env.JOB_STATUS,
              timestamp_utc: new Date().toISOString(),
              run_id: process.env.RUN_ID,
              run_number: process.env.RUN_NUMBER,
              pipeline_conclusion: report?.conclusion || (process.env.JOB_STATUS === "success" ? "PASS" : "FAIL"),
              summary: report?.summary || null,
              steps: report?.steps || []
            };

            fs.writeFileSync("qa.json", JSON.stringify(statusPayload, null, 2), "utf8");
          '

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin run-status:run-status || git branch run-status
          git checkout run-status
          git pull --rebase origin run-status || true

          mv -f qa.json ./qa.json
          git add qa.json

          if git diff --staged --quiet; then
            echo "Nenhuma alteração em qa.json para commitar."
          else
            git commit -m "chore(status): update qa.json [skip ci]"
            for attempt in 1 2 3 4 5; do
              echo "Tentativa de push ${attempt}..."
              if git push origin run-status; then
                echo "Push concluído com sucesso!"
                break
              fi
              echo "Conflito concorrente detectado, reexecutando rebase..."
              git fetch origin run-status
              git rebase origin/run-status || (git rebase --abort && git pull --rebase -X theirs origin run-status)
              sleep $((attempt * 2))
            done
          fi

  # ============================================================================
  # JOB 2: Prova de Privacidade do Caderno e Recados (CAD-01 a CAD-07)
  # Trabalha de forma estritamente independente de qa-general, em bancada descartável
  # ============================================================================
  caderno-privacy-proof:
    name: Caderno Privacy Proof (CAD-01..07)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.5.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Trava de CI — Integridade de Módulos Node dos Executores
        run: node scripts/check-executor-modules.mjs

      - name: Download & Extract PocketBase 0.26.x
        run: |
          PB_VERSION="0.26.1"
          echo "Baixando PocketBase oficial v${PB_VERSION} para linux_amd64..."
          curl -sSL -o pb.zip "https://github.com/pocketbase/pocketbase/releases/download/v${PB_VERSION}/pocketbase_${PB_VERSION}_linux_amd64.zip"
          unzip -q pb.zip -d /usr/local/bin
          chmod +x /usr/local/bin/pocketbase
          pocketbase --version

      - name: Run Caderno Privacy Proof on Disposable Bench
        id: run_proof
        env:
          VITE_POCKETBASE_URL: 'http://127.0.0.1:8090'
          CER_ALLOW_MUTABLE_TESTS: 'true'
          CER_TEST_ENV: 'isolated'
          CER_BENCH_SUPERUSER_EMAIL: 'bench-admin@cer.isolated'
          CER_BENCH_SUPERUSER_PASSWORD: 'BenchAdminSecret123!'
          CER_REPORT_JSON_PATH: 'caderno-report.json'
        run: |
          set -euo pipefail

          # 1. Criar workspace temporário efêmero (mktemp -d)
          BENCH_TMP=$(mktemp -d /tmp/pb_caderno_proof_XXXXXX)
          echo "Diretório efêmero criado: ${BENCH_TMP}"

          mkdir -p "${BENCH_TMP}/pb_migrations"
          mkdir -p "${BENCH_TMP}/pb_hooks"
          mkdir -p "${BENCH_TMP}/pb_data"

          # 2. Copiar migrations e hooks do repositório
          cp -r pocketbase/migrations/* "${BENCH_TMP}/pb_migrations/"
          cp -r pocketbase/hooks/* "${BENCH_TMP}/pb_hooks/"

          # 3. Criar superuser efêmero para permitir o bootstrap de dados de teste
          echo "Criando superuser efêmero na base de dados descartável..."
          pocketbase superuser upsert "${CER_BENCH_SUPERUSER_EMAIL}" "${CER_BENCH_SUPERUSER_PASSWORD}" \
            --dir="${BENCH_TMP}/pb_data"

          # 4. Iniciar PocketBase descartável em 127.0.0.1:8090
          echo "Iniciando PocketBase em 127.0.0.1:8090..."
          pocketbase serve \
            --dir="${BENCH_TMP}/pb_data" \
            --migrationsDir="${BENCH_TMP}/pb_migrations" \
            --hooksDir="${BENCH_TMP}/pb_hooks" \
            --http="127.0.0.1:8090" > "${BENCH_TMP}/pocketbase.log" 2>&1 &
          PB_PID=$!
          echo "PocketBase em execução com PID ${PB_PID}"

          # Definir trap de limpeza rigoroso para teardown garantido
          cleanup() {
            echo ""
            echo "=== TEARDOWN DA BANCADA DESCARTÁVEL ==="
            if [ -n "${PB_PID:-}" ] && kill -0 "${PB_PID}" 2>/dev/null; then
              echo "Encerrando processo PocketBase (PID ${PB_PID})..."
              kill -TERM "${PB_PID}" || true
              wait "${PB_PID}" 2>/dev/null || true
            fi
            if [ -d "${BENCH_TMP}" ]; then
              echo "Destruindo diretório temporário: ${BENCH_TMP}"
              rm -rf "${BENCH_TMP}"
            fi
            echo "Teardown concluído."
          }
          trap cleanup EXIT

          # 5. Aguardar healthcheck em 127.0.0.1:8090/api/health
          echo "Aguardando inicialização do PocketBase descartável..."
          READY=0
          for i in $(seq 1 30); do
            if curl -fsSL "http://127.0.0.1:8090/api/health" > /dev/null 2>&1; then
              echo "PocketBase pronto e respondendo em http://127.0.0.1:8090 após ${i}s."
              READY=1
              break
            fi
            sleep 1
          done

          if [ "${READY}" -ne 1 ]; then
            echo "[ERRO FATAL] PocketBase não iniciou no tempo limite!"
            echo "=== LOGS DO POCKETBASE ==="
            cat "${BENCH_TMP}/pocketbase.log" || true
            exit 1
          fi

          # 6. Executar APENAS a suíte de provas de privacidade (CAD-01 a CAD-07)
          echo ""
          echo "=== EXECUTANDO PROVA DE PRIVACIDADE CAD-01..07 ==="
          pnpm run test:caderno-privacy

      - name: Publicar Status do Job Caderno Privacy no branch run-status
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          node -e '
            const fs = require("node:fs");
            const expectedIds = ["CAD-01", "CAD-02", "CAD-03", "CAD-04", "CAD-05", "CAD-06", "CAD-07"];
            let report = null;
            if (fs.existsSync("caderno-report.json")) {
              try {
                report = JSON.parse(fs.readFileSync("caderno-report.json", "utf8"));
              } catch (e) {
                console.warn("Falha ao ler caderno-report.json:", e);
              }
            }

            const scenarios = expectedIds.map(id => {
              const found = report?.scenarios?.find(s => s.id === id);
              if (found) return found;
              return {
                id,
                status: process.env.JOB_STATUS === "success" ? "PASS" : "NÃO EXECUTADO",
                description: "Prova de privacidade do caderno",
                details: process.env.JOB_STATUS === "success" ? "Executado" : "Job interrompido antes ou durante a execução"
              };
            });

            const statusPayload = {
              job: "caderno-privacy-proof",
              job_name: "Caderno Privacy Proof (CAD-01..07)",
              sha: process.env.COMMIT_SHA,
              conclusion: process.env.JOB_STATUS,
              timestamp_utc: new Date().toISOString(),
              run_id: process.env.RUN_ID,
              run_number: process.env.RUN_NUMBER,
              summary: report?.summary || null,
              scenarios
            };

            fs.writeFileSync("caderno.json", JSON.stringify(statusPayload, null, 2), "utf8");
          '

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin run-status:run-status || git branch run-status
          git checkout run-status
          git pull --rebase origin run-status || true

          mv -f caderno.json ./caderno.json
          git add caderno.json

          if git diff --staged --quiet; then
            echo "Nenhuma alteração em caderno.json para commitar."
          else
            git commit -m "chore(status): update caderno.json [skip ci]"
            for attempt in 1 2 3 4 5; do
              echo "Tentativa de push ${attempt}..."
              if git push origin run-status; then
                echo "Push concluído com sucesso!"
                break
              fi
              echo "Conflito concorrente detectado, reexecutando rebase..."
              git fetch origin run-status
              git rebase origin/run-status || (git rebase --abort && git pull --rebase -X theirs origin run-status)
              sleep $((attempt * 2))
            done
          fi

  # ============================================================================
  # JOB 3: Verificação do Primeiro Atendimento (0.0.70 — PAV-01 a PAV-06)
  # Executado em bancada descartável com 6 verificações reais contra a API
  # ============================================================================
  primeiro-atendimento-verification:
    name: Primeiro Atendimento Verification (PAV-01..06)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.5.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Trava de CI — Integridade de Módulos Node dos Executores
        run: node scripts/check-executor-modules.mjs

      - name: Download & Extract PocketBase 0.26.x
        run: |
          PB_VERSION="0.26.1"
          echo "Baixando PocketBase oficial v${PB_VERSION} para linux_amd64..."
          curl -sSL -o pb.zip "https://github.com/pocketbase/pocketbase/releases/download/v${PB_VERSION}/pocketbase_${PB_VERSION}_linux_amd64.zip"
          unzip -q pb.zip -d /usr/local/bin
          chmod +x /usr/local/bin/pocketbase
          pocketbase --version

      - name: Run Primeiro Atendimento Verification on Disposable Bench
        id: run_verification
        env:
          VITE_POCKETBASE_URL: 'http://127.0.0.1:8090'
          CER_ALLOW_MUTABLE_TESTS: 'true'
          CER_TEST_ENV: 'isolated'
          CER_BENCH_SUPERUSER_EMAIL: 'bench-admin@cer.isolated'
          CER_BENCH_SUPERUSER_PASSWORD: 'BenchAdminSecret123!'
          CER_REPORT_JSON_PATH: 'pav-report.json'
        run: |
          set -euo pipefail

          # 1. Criar workspace temporário efêmero (mktemp -d)
          BENCH_TMP=$(mktemp -d /tmp/pb_primeiro_atendimento_XXXXXX)
          echo "Diretório efêmero criado: ${BENCH_TMP}"

          mkdir -p "${BENCH_TMP}/pb_migrations"
          mkdir -p "${BENCH_TMP}/pb_hooks"
          mkdir -p "${BENCH_TMP}/pb_data"

          # 2. Copiar migrations e hooks do repositório
          cp -r pocketbase/migrations/* "${BENCH_TMP}/pb_migrations/"
          cp -r pocketbase/hooks/* "${BENCH_TMP}/pb_hooks/"

          # 3. Criar superuser efêmero para permitir o bootstrap de dados de teste
          echo "Criando superuser efêmero na base de dados descartável..."
          pocketbase superuser upsert "${CER_BENCH_SUPERUSER_EMAIL}" "${CER_BENCH_SUPERUSER_PASSWORD}" \
            --dir="${BENCH_TMP}/pb_data"

          # 4. Iniciar PocketBase descartável em 127.0.0.1:8090
          echo "Iniciando PocketBase em 127.0.0.1:8090..."
          pocketbase serve \
            --dir="${BENCH_TMP}/pb_data" \
            --migrationsDir="${BENCH_TMP}/pb_migrations" \
            --hooksDir="${BENCH_TMP}/pb_hooks" \
            --http="127.0.0.1:8090" > "${BENCH_TMP}/pocketbase.log" 2>&1 &
          PB_PID=$!
          echo "PocketBase em execução com PID ${PB_PID}"

          # Definir trap de limpeza rigoroso para teardown garantido
          cleanup() {
            echo ""
            echo "=== TEARDOWN DA BANCADA DESCARTÁVEL ==="
            if [ -n "${PB_PID:-}" ] && kill -0 "${PB_PID}" 2>/dev/null; then
              echo "Encerrando processo PocketBase (PID ${PB_PID})..."
              kill -TERM "${PB_PID}" || true
              wait "${PB_PID}" 2>/dev/null || true
            fi
            if [ -d "${BENCH_TMP}" ]; then
              echo "Destruindo diretório temporário: ${BENCH_TMP}"
              rm -rf "${BENCH_TMP}"
            fi
            echo "Teardown concluído."
          }
          trap cleanup EXIT

          # 5. Aguardar healthcheck em 127.0.0.1:8090/api/health
          echo "Aguardando inicialização do PocketBase descartável..."
          READY=0
          for i in $(seq 1 30); do
            if curl -fsSL "http://127.0.0.1:8090/api/health" > /dev/null 2>&1; then
              echo "PocketBase pronto e respondendo em http://127.0.0.1:8090 após ${i}s."
              READY=1
              break
            fi
            sleep 1
          done

          if [ "${READY}" -ne 1 ]; then
            echo "[ERRO FATAL] PocketBase não iniciou no tempo limite!"
            echo "=== LOGS DO POCKETBASE ==="
            cat "${BENCH_TMP}/pocketbase.log" || true
            exit 1
          fi

          # 6. Executar suíte de verificação do Primeiro Atendimento (PAV-01 a PAV-06)
          echo ""
          echo "=== EXECUTANDO VERIFICAÇÃO DO PRIMEIRO ATENDIMENTO PAV-01..06 ==="
          pnpm run test:primeiro-atendimento-verification

      - name: Publicar Status do Job Primeiro Atendimento no branch run-status
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          node -e '
            const fs = require("node:fs");
            const expectedIds = ["PAV-01", "PAV-02", "PAV-03", "PAV-04", "PAV-05", "PAV-06"];
            let report = null;
            if (fs.existsSync("pav-report.json")) {
              try {
                report = JSON.parse(fs.readFileSync("pav-report.json", "utf8"));
              } catch (e) {
                console.warn("Falha ao ler pav-report.json:", e);
              }
            }

            const scenarios = expectedIds.map(id => {
              const found = report?.scenarios?.find(s => s.id === id);
              if (found) return found;
              return {
                id,
                status: process.env.JOB_STATUS === "success" ? "PASS" : "NÃO EXECUTADO",
                description: "Verificação funcional do primeiro atendimento",
                details: process.env.JOB_STATUS === "success" ? "Executado" : "Job interrompido antes ou durante a execução"
              };
            });

            const statusPayload = {
              job: "primeiro-atendimento-verification",
              job_name: "Primeiro Atendimento Verification (PAV-01..06)",
              sha: process.env.COMMIT_SHA,
              conclusion: process.env.JOB_STATUS,
              timestamp_utc: new Date().toISOString(),
              run_id: process.env.RUN_ID,
              run_number: process.env.RUN_NUMBER,
              summary: report?.summary || null,
              scenarios
            };

            fs.writeFileSync("pav.json", JSON.stringify(statusPayload, null, 2), "utf8");
          '

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin run-status:run-status || git branch run-status
          git checkout run-status
          git pull --rebase origin run-status || true

          mv -f pav.json ./pav.json
          git add pav.json

          if git diff --staged --quiet; then
            echo "Nenhuma alteração em pav.json para commitar."
          else
            git commit -m "chore(status): update pav.json [skip ci]"
            for attempt in 1 2 3 4 5; do
              echo "Tentativa de push ${attempt}..."
              if git push origin run-status; then
                echo "Push concluído com sucesso!"
                break
              fi
              echo "Conflito concorrente detectado, reexecutando rebase..."
              git fetch origin run-status
              git rebase origin/run-status || (git rebase --abort && git pull --rebase -X theirs origin run-status)
              sleep $((attempt * 2))
            done
          fi

  # ============================================================================
  # JOB 4: Visual Demo — Primeiro Atendimento (Conferência Visual no Navegador)
  # Executado em bancada descartável com Playwright Chromium headless e Vite preview
  # ============================================================================
  visual-demo-primeiro-atendimento:
    name: Visual Demo — Primeiro Atendimento
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.5.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium with dependencies
        run: npx playwright install chromium --with-deps

      - name: Trava de CI — Integridade de Módulos Node dos Executores
        run: node scripts/check-executor-modules.mjs

      - name: Download & Extract PocketBase 0.26.x
        run: |
          PB_VERSION="0.26.1"
          echo "Baixando PocketBase oficial v${PB_VERSION} para linux_amd64..."
          curl -sSL -o pb.zip "https://github.com/pocketbase/pocketbase/releases/download/v${PB_VERSION}/pocketbase_${PB_VERSION}_linux_amd64.zip"
          unzip -q pb.zip -d /usr/local/bin
          chmod +x /usr/local/bin/pocketbase
          pocketbase --version

      - name: Build Vite App for Disposable Bench
        env:
          VITE_POCKETBASE_URL: 'http://127.0.0.1:8090'
        run: pnpm run build

      - name: Run Visual Demo Flow on Disposable Bench
        id: run_visual_demo
        env:
          VITE_POCKETBASE_URL: 'http://127.0.0.1:8090'
          CER_ALLOW_MUTABLE_TESTS: 'true'
          CER_TEST_ENV: 'isolated'
          CER_BENCH_SUPERUSER_EMAIL: 'bench-admin@cer.isolated'
          CER_BENCH_SUPERUSER_PASSWORD: 'BenchAdminSecret123!'
          APP_URL: 'http://127.0.0.1:4173'
          VISUAL_ARTIFACTS_DIR: '${{ github.workspace }}/demo-visual-primeiro-atendimento'
          CER_REPORT_JSON_PATH: 'visual-demo-report.json'
        run: |
          set -euo pipefail

          # 1. Criar workspace temporário efêmero (mktemp -d)
          BENCH_TMP=$(mktemp -d /tmp/pb_visual_demo_XXXXXX)
          echo "Diretório efêmero criado: ${BENCH_TMP}"

          mkdir -p "${BENCH_TMP}/pb_migrations"
          mkdir -p "${BENCH_TMP}/pb_hooks"
          mkdir -p "${BENCH_TMP}/pb_data"

          # 2. Copiar migrations e hooks do repositório
          cp -r pocketbase/migrations/* "${BENCH_TMP}/pb_migrations/"
          cp -r pocketbase/hooks/* "${BENCH_TMP}/pb_hooks/"

          # 3. Criar superuser efêmero para permitir o bootstrap de dados de teste
          echo "Criando superuser efêmero na base de dados descartável..."
          pocketbase superuser upsert "${CER_BENCH_SUPERUSER_EMAIL}" "${CER_BENCH_SUPERUSER_PASSWORD}" \
            --dir="${BENCH_TMP}/pb_data"

          # 4. Iniciar PocketBase descartável em 127.0.0.1:8090
          echo "Iniciando PocketBase em 127.0.0.1:8090..."
          pocketbase serve \
            --dir="${BENCH_TMP}/pb_data" \
            --migrationsDir="${BENCH_TMP}/pb_migrations" \
            --hooksDir="${BENCH_TMP}/pb_hooks" \
            --http="127.0.0.1:8090" > "${BENCH_TMP}/pocketbase.log" 2>&1 &
          PB_PID=$!
          echo "PocketBase em execução com PID ${PB_PID}"

          # 5. Iniciar Vite Preview em 127.0.0.1:4173
          echo "Iniciando Vite Preview em 127.0.0.1:4173..."
          pnpm run preview --host 127.0.0.1 --port 4173 > "${BENCH_TMP}/vite-preview.log" 2>&1 &
          VITE_PID=$!
          echo "Vite Preview em execução com PID ${VITE_PID}"

          # Definir trap de limpeza rigoroso para teardown garantido
          cleanup() {
            echo ""
            echo "=== TEARDOWN DA BANCADA VISUAL DESCARTÁVEL ==="
            if [ -n "${VITE_PID:-}" ] && kill -0 "${VITE_PID}" 2>/dev/null; then
              echo "Encerrando Vite Preview (PID ${VITE_PID})..."
              kill -TERM "${VITE_PID}" || true
              wait "${VITE_PID}" 2>/dev/null || true
            fi
            if [ -n "${PB_PID:-}" ] && kill -0 "${PB_PID}" 2>/dev/null; then
              echo "Encerrando processo PocketBase (PID ${PB_PID})..."
              kill -TERM "${PB_PID}" || true
              wait "${PB_PID}" 2>/dev/null || true
            fi
            if [ -d "${BENCH_TMP}" ]; then
              echo "Destruindo diretório temporário: ${BENCH_TMP}"
              rm -rf "${BENCH_TMP}"
            fi
            echo "Teardown concluído."
          }
          trap cleanup EXIT

          # 6. Aguardar healthchecks
          echo "Aguardando inicialização do PocketBase descartável..."
          PB_READY=0
          for i in $(seq 1 30); do
            if curl -fsSL "http://127.0.0.1:8090/api/health" > /dev/null 2>&1; then
              echo "PocketBase pronto e respondendo em http://127.0.0.1:8090 após ${i}s."
              PB_READY=1
              break
            fi
            sleep 1
          done

          if [ "${PB_READY}" -ne 1 ]; then
            echo "[ERRO FATAL] PocketBase não iniciou no tempo limite!"
            echo "=== LOGS DO POCKETBASE ==="
            cat "${BENCH_TMP}/pocketbase.log" || true
            exit 1
          fi

          echo "Aguardando inicialização do Vite Preview..."
          VITE_READY=0
          for i in $(seq 1 30); do
            if curl -fsSL "http://127.0.0.1:4173" > /dev/null 2>&1; then
              echo "Vite Preview pronto e respondendo em http://127.0.0.1:4173 após ${i}s."
              VITE_READY=1
              break
            fi
            sleep 1
          done

          if [ "${VITE_READY}" -ne 1 ]; then
            echo "[ERRO FATAL] Vite Preview não iniciou no tempo limite!"
            echo "=== LOGS DO VITE ==="
            cat "${BENCH_TMP}/vite-preview.log" || true
            exit 1
          fi

          # 7. Executar demonstração visual completa
          echo ""
          echo "=== EXECUTANDO DEMONSTRAÇÃO VISUAL NO NAVEGADOR (8 ETAPAS) ==="
          pnpm run test:pav-visual

      - name: Upload Visual Demo Artifacts (Capturas + Vídeo)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-visual-primeiro-atendimento
          path: demo-visual-primeiro-atendimento/
          if-no-files-found: warn
          retention-days: 14

      - name: Publicar Status do Job Visual Demo no branch run-status
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          node -e '
            const fs = require("node:fs");
            let report = null;
            if (fs.existsSync("visual-demo-report.json")) {
              try {
                report = JSON.parse(fs.readFileSync("visual-demo-report.json", "utf8"));
              } catch (e) {
                console.warn("Falha ao ler visual-demo-report.json:", e);
              }
            }

            const defaultSteps = [
              { num: 1, id: "01-relato-rascunho", title: "Interagente A: Relato Inicial em Rascunho" },
              { num: 2, id: "02-relato-enviado", title: "Interagente A: Relato Enviado para Daiane" },
              { num: 3, id: "03-prontuario-relato", title: "Profissional: Prontuário com Relato Recebido" },
              { num: 4, id: "04-nota-privada", title: "Profissional: Sessão Manual e Nota Privada" },
              { num: 5, id: "05-plano-compartilhado", title: "Profissional: Plano de Cuidado Compartilhado" },
              { num: 6, id: "06-retorno-proximo-passo", title: "Interagente A: Retorno ao Próximo Passo" },
              { num: 7, id: "07-retorno-no-prontuario", title: "Profissional: Retorno da Interagente no Prontuário" },
              { num: 8, id: "08-interagente-b-sem-acesso", title: "Interagente B: Isolamento Estrito" }
            ];

            const steps = defaultSteps.map(ds => {
              const found = report?.steps?.find(s => s.num === ds.num || s.id === ds.id);
              if (found) return found;
              return {
                num: ds.num,
                id: ds.id,
                title: ds.title,
                status: process.env.JOB_STATUS === "success" ? "PASS" : "NÃO EXECUTADO",
                note: process.env.JOB_STATUS === "success" ? "" : "Job interrompido antes ou durante a etapa"
              };
            });

            const statusPayload = {
              job: "visual-demo-primeiro-atendimento",
              job_name: "Visual Demo — Primeiro Atendimento",
              sha: process.env.COMMIT_SHA,
              conclusion: process.env.JOB_STATUS,
              timestamp_utc: new Date().toISOString(),
              run_id: process.env.RUN_ID,
              run_number: process.env.RUN_NUMBER,
              all_success: report ? report.all_success : (process.env.JOB_STATUS === "success"),
              failure_reason: report?.failure_reason || (process.env.JOB_STATUS === "success" ? null : "Job falhou antes de concluir"),
              steps
            };

            fs.writeFileSync("visual-demo.json", JSON.stringify(statusPayload, null, 2), "utf8");
          '

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin run-status:run-status || git branch run-status
          git checkout run-status
          git pull --rebase origin run-status || true

          mv -f visual-demo.json ./visual-demo.json
          git add visual-demo.json

          if git diff --staged --quiet; then
            echo "Nenhuma alteração em visual-demo.json para commitar."
          else
            git commit -m "chore(status): update visual-demo.json [skip ci]"
            for attempt in 1 2 3 4 5; do
              echo "Tentativa de push ${attempt}..."
              if git push origin run-status; then
                echo "Push concluído com sucesso!"
                break
              fi
              echo "Conflito concorrente detectado, reexecutando rebase..."
              git fetch origin run-status
              git rebase origin/run-status || (git rebase --abort && git pull --rebase -X theirs origin run-status)
              sleep $((attempt * 2))
            done
          fi
